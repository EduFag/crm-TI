name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-crm-ti-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ti.moneypromotora.com.br
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/edufa/crm-TI
            ESPERADO="${{ github.sha }}"
            echo "Commit esperado pelo Action: ${ESPERADO}"
            echo "Remote: $(git remote -v | head -n 2)"
            # Força atualização da ref remota (evita origin/main stale)
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            echo "origin/main após fetch: $(git rev-parse origin/main)"
            echo "ls-remote main: $(git ls-remote origin refs/heads/main)"
            git checkout -B main origin/main
            git reset --hard origin/main
            HEAD_ATUAL="$(git rev-parse HEAD)"
            echo "HEAD após checkout: ${HEAD_ATUAL}"
            if [ "${HEAD_ATUAL}" != "${ESPERADO}" ]; then
              echo "ERRO: VPS não está no commit do Action (origin/main desatualizado ou remote divergente)."
              exit 1
            fi
            SKIP_GIT=1 bash .vps/deploy.sh
