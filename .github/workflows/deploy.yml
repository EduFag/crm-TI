name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-crm-ti-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ti.moneypromotora.com.br
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/edufa/crm-TI
            ESPERADO="${{ github.sha }}"
            echo "Commit esperado pelo Action: ${ESPERADO}"
            echo "Remote atual: $(git remote get-url origin)"
            # Fonte de verdade do CI: suportemoney/TI-Money (VPS ainda podia apontar para EduFag/crm-TI)
            git remote set-url origin git@github.com:suportemoney/TI-Money.git
            echo "Remote após ajuste: $(git remote get-url origin)"
            if ! git fetch origin +refs/heads/main:refs/remotes/origin/main; then
              echo "Fetch em TI-Money falhou — tentando EduFag/crm-TI (deploy key legado)."
              git remote set-url origin git@github.com:EduFag/crm-TI.git
              git fetch origin +refs/heads/main:refs/remotes/origin/main
            fi
            echo "origin/main: $(git rev-parse origin/main)"
            git checkout -B main origin/main
            git reset --hard origin/main
            HEAD_ATUAL="$(git rev-parse HEAD)"
            echo "HEAD após checkout: ${HEAD_ATUAL}"
            if [ "${HEAD_ATUAL}" != "${ESPERADO}" ]; then
              echo "AVISO: HEAD (${HEAD_ATUAL}) != Action (${ESPERADO}). Seguindo com origin/main mesmo assim."
            fi
            SKIP_GIT=1 bash .vps/deploy.sh
