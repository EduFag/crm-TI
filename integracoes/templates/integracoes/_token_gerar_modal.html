{# Modal: formulário para gerar token de API #}
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40"
     onclick="document.getElementById('modal-container').innerHTML = ''"></div>

<div class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md max-h-[90vh] overflow-hidden pointer-events-auto flex flex-col"
         onclick="event.stopPropagation()">

        <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50 shrink-0">
            <div>
                <h3 class="text-lg font-bold text-slate-900 tracking-tight">Gerar token API</h3>
                <p class="text-xs text-slate-500 mt-0.5">O valor completo aparece só uma vez após gerar.</p>
            </div>
            <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''"
                    class="text-slate-400 hover:text-slate-600 bg-white p-1.5 rounded-lg shadow-sm border border-slate-200 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form method="post"
              action="{{ form_action }}"
              hx-post="{{ form_action }}"
              hx-target="#modal-container"
              hx-swap="innerHTML"
              class="flex flex-col flex-1 min-h-0">
            {% csrf_token %}

            {% if erro %}
            <div class="mx-6 mt-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3">{{ erro }}</div>
            {% endif %}

            <div class="px-6 py-5 space-y-4">
                <div>
                    <label for="token-nome" class="block text-sm font-medium text-slate-700 mb-1">Nome do token</label>
                    <input type="text" name="nome" id="token-nome" required maxlength="120"
                           value="{{ nome|default:'' }}"
                           placeholder="Ex.: Integração ERP Cliente"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2 shrink-0">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''"
                        class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 rounded-lg">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-5 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">
                    Gerar
                </button>
            </div>
        </form>
    </div>
</div>
