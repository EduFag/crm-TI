<!-- Backdrop -->
<div class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-40 transition-opacity" 
     onclick="document.getElementById('drawer-container').innerHTML = ''"></div>

<!-- Drawer Content -->
<div class="fixed inset-y-0 right-0 w-full max-w-xl bg-slate-50 shadow-2xl z-50 flex flex-col transform transition-transform duration-300 ease-in-out border-l border-slate-200">
    
    <!-- Cabeçalho -->
    <div class="px-6 py-5 border-b border-slate-200 flex items-center justify-between bg-white">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-100 text-indigo-600 p-2 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 tracking-tight">Central Informativa</h3>
        </div>
        <button type="button" class="text-slate-400 hover:text-slate-600 transition-colors" onclick="document.getElementById('drawer-container').innerHTML = ''">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Container das mensagens -->
    <div class="flex-1 overflow-y-auto overflow-x-hidden p-4 flex flex-col scroll-smooth" id="informative-chat-messages" 
         hx-get="{% url 'helpdesk:informative_list' %}" hx-trigger="load, every 10s" hx-swap="innerHTML">
        
        <div class="flex items-center justify-center h-full text-slate-400">
            <svg class="w-5 h-5 animate-spin mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Carregando chat...
        </div>
        
    </div>

    <!-- Formulário -->
    {% include "helpdesk/informative/_form.html" %}
</div>
